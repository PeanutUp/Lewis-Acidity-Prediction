model_name: "dimenet++"

emb_size: 128
out_emb_size: 256
int_emb_size: 64
basis_emb_size: 8
num_blocks: 4

num_spherical: 7
num_radial: 6
output_init: 'GlorotOrthogonal'

extensive: True
cutoff: 5.0
envelope_exponent: 5

num_before_skip: 1
num_after_skip: 2
num_dense_output: 3

num_train: 45000
num_valid: 2000
data_seed: 42
dataset: "data/fia49k_full_processed.npz"
logdir: "logs_fia49k"

num_steps: 100000
ema_decay: 0.999

learning_rate: 0.001
warmup_steps: 3000
decay_rate: 0.01
decay_steps: 4000000

batch_size: 32
evaluation_interval: 1000
save_interval: 1000
restart: null
comment: "fia49k_training"
targets: ['fia_gas-DSDBLYP']
